services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: charitystride_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: charitystride
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - charitystride-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Laravel 12 Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: charitystride_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: charitystride
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - charitystride-net

  # Next.js 16 Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: charitystride_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_REVERB_HOST: localhost
      NEXT_PUBLIC_REVERB_PORT: 8080
      NEXT_PUBLIC_REVERB_SCHEME: http
      NEXT_PUBLIC_REVERB_APP_KEY: charitystride_key
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - charitystride-net

  # phpMyAdmin Database Management Interface
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: charitystride_pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - charitystride-net

volumes:
  mysql_data:
    driver: local

networks:
  charitystride-net:
    driver: bridge
